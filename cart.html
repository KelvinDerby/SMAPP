<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f9f9f7;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #5a8f5a;
        }

        .logo {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 50px;
            width: 50px;
            background-color: #4c956c;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            color: white;
            font-size: 1.5rem;
        }

        .logo-text {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2a4d2a;
        }

        .logo-text span {
            color: #5a8f5a;
        }

        .cart-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-icon {
            position: relative;
        }

        .cart-count {
            position: absolute;
            top: -8px;
            right: -8px;
            background-color: #ff6b6b;
            color: white;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .cart-items {
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            padding: 20px;
        }

        .cart-summary {
            background: white;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            padding: 20px;
            height: fit-content;
        }

        .cart-title {
            font-size: 1.5rem;
            color: #2a4d2a;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .cart-item {
            display: flex;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .item-image {
            width: 100px;
            height: 100px;
            background-color: #f1f8f1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
        }

        .item-image i {
            font-size: 2rem;
            color: #5a8f5a;
        }

        .item-details {
            flex: 1;
        }

        .item-name {
            font-weight: bold;
            font-size: 1.1rem;
            color: #2a4d2a;
            margin-bottom: 5px;
        }

        .item-price {
            color: #5a8f5a;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            background: #f1f8f1;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            color: #5a8f5a;
            font-weight: bold;
        }

        .quantity-input {
            width: 40px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 5px;
        }

        .item-remove {
            color: #ff6b6b;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2rem;
            align-self: flex-start;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.2rem;
            margin: 20px 0;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .btn-checkout {
            width: 100%;
            padding: 12px;
            background-color: #5a8f5a;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            font-size: 1.1rem;
        }

        .btn-checkout:hover {
            background-color: #4a7d4a;
        }

        .continue-shopping {
            display: inline-block;
            margin-top: 15px;
            color: #5a8f5a;
            text-decoration: none;
            font-weight: 500;
        }

        .continue-shopping:hover {
            text-decoration: underline;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 0;
            color: #888;
        }

        .empty-cart i {
            font-size: 3rem;
            color: #ddd;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
            
            .cart-item {
                flex-direction: column;
            }
            
            .item-image {
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">
                <div class="logo-img">
                    <i class="fas fa-tractor"></i>
                </div>
                <div class="logo-text">Farm<span>Fresh</span></div>
            </div>
            <div class="cart-header">
                <h1>Shopping Cart</h1>
                <div class="cart-icon">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>

        <div class="cart-container">
            <div class="cart-items">
                <h2 class="cart-title">Your Cart Items</h2>
                <div id="cartItems">
                    <!-- Cart items will be displayed here -->
                </div>
            </div>

            <div class="cart-summary">
                <h2 class="cart-title">Order Summary</h2>
                <div class="summary-item">
                    <span>Subtotal</span>
                    <span id="subtotal">$0.00</span>
                </div>
                <div class="summary-item">
                    <span>Shipping</span>
                    <span id="shipping">$0.00</span>
                </div>
                <div class="summary-total">
                    <span>Total</span>
                    <span id="grandTotal">$0.00</span>
                </div>
                <button class="btn-checkout">Proceed to Checkout</button>
                <a href="#" class="continue-shopping">Continue Shopping</a>
            </div>
        </div>
    </div>

    <script>
        // Sample product data
        const products = [
            { id: 1, name: "Organic Tomatoes", price: "$4.99", image: "fas fa-apple-alt" },
            { id: 2, name: "Fresh Avocados", price: "$3.49", image: "fas fa-leaf" },
            { id: 3, name: "Farm Eggs", price: "$5.99", image: "fas fa-egg" }
        ];

        // Initialize cart with sample items
        let cartItems = [
            { id: 1, name: "Organic Tomatoes", price: "$4.99", quantity: 2, image: "fas fa-apple-alt" },
            { id: 2, name: "Fresh Avocados", price: "$3.49", quantity: 1, image: "fas fa-leaf" }
        ];

        // Save cart to localStorage
        function saveCartToStorage() {
            localStorage.setItem('cartItems', JSON.stringify(cartItems));
        }

        // Load cart from localStorage
        function loadCartFromStorage() {
            const storedCart = localStorage.getItem('cartItems');
            if (storedCart) {
                cartItems = JSON.parse(storedCart);
            }
        }

        // Update cart count badge
        function updateCartCount() {
            const totalItems = cartItems.reduce((total, item) => total + item.quantity, 0);
            document.getElementById('cartCount').textContent = totalItems;
        }

        // Remove item from cart
        function removeItemFromCart(index) {
            cartItems.splice(index, 1);
            saveCartToStorage();
            displayCartItems();
        }

        // Update item quantity
        function updateQuantity(index, change) {
            cartItems[index].quantity += change;
            
            // Remove item if quantity becomes 0
            if (cartItems[index].quantity <= 0) {
                removeItemFromCart(index);
            } else {
                saveCartToStorage();
                displayCartItems();
            }
        }

        // Display cart items
        function displayCartItems() {
            const cartItemsContainer = document.getElementById('cartItems');
            const subtotalElement = document.getElementById('subtotal');
            const shippingElement = document.getElementById('shipping');
            const grandTotalElement = document.getElementById('grandTotal');
            
            if (!cartItems.length) {
                cartItemsContainer.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-shopping-cart"></i>
                        <p>Your cart is empty.</p>
                    </div>
                `;
                subtotalElement.textContent = '$0.00';
                shippingElement.textContent = '$0.00';
                grandTotalElement.textContent = '$0.00';
                updateCartCount();
                return;
            }
            
            let subtotal = 0;
            let html = '';
            
            cartItems.forEach((item, index) => {
                const price = parseFloat(item.price.replace(/[^0-9.]/g, ''));
                const itemTotal = price * item.quantity;
                subtotal += itemTotal;
                
                html += `
                    <div class="cart-item">
                        <div class="item-image">
                            <i class="${item.image}"></i>
                        </div>
                        <div class="item-details">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">${item.price}</div>
                            <div class="item-quantity">
                                <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">-</button>
                                <input type="text" class="quantity-input" value="${item.quantity}" readonly>
                                <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </div>
                        <button class="item-remove" onclick="removeItemFromCart(${index})">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                    </div>
                `;
            });
            
            cartItemsContainer.innerHTML = html;
            const shipping = subtotal > 50 ? 0 : 5.99;
            const grandTotal = subtotal + shipping;
            
            subtotalElement.textContent = `$${subtotal.toFixed(2)}`;
            shippingElement.textContent = shipping === 0 ? 'FREE' : `$${shipping.toFixed(2)}`;
            grandTotalElement.textContent = `$${grandTotal.toFixed(2)}`;
            
            updateCartCount();
        }
        
        // Initialize the page
        function init() {
            loadCartFromStorage();
            displayCartItems();
        }
        
        // Call on page load
        init();
    </script>

</script>
</body>
</html>
